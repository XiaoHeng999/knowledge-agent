appId: com.agentclaw.app
productName: AgentClaw
copyright: Copyright © 2024 AgentClaw

publish:
  provider: github
  owner: agentclaw
  repo: agentclaw

directories:
  buildResources: resources
  output: release

# ASAR archive — compresses the app source into a single file
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"

# Only include what's needed in production
files:
  - dist/**/*
  - out/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/*.spec.*"
  - "!**/*.test.*"
  - "!docs/**"
  - "!openspec/**"
  - "!resources/**"

extraMetadata:
  main: dist/electron/main.js

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  # Notarization — set env vars APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
  notarize: true

dmg:
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AgentClaw
  artifactName: "${productName}-${version}-Setup.${ext}"
  # Compress installer
  compression: lzma

portable:
  artifactName: "${productName}-${version}-Portable.${ext}"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: resources/icon.png
  category: Office
  mimeTypes:
    - application/json
    - text/markdown
  artifactName: "${productName}-${version}-${arch}.${ext}"

appImage:
  artifactName: "${productName}-${version}-${arch}.AppImage"

deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
  artifactName: "${productName}-${version}-${arch}.deb"

rpm:
  artifactName: "${productName}-${version}-${arch}.rpm"

# Compression settings for smaller packages
compression: xz
